<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora 50/30/20</title>
<style>
  :root { --tinta: #1b1b1f; --suave: #5a5e66; --acento: #1e5a96; --linea: #dcdfe4; }
  body { margin: 0; padding: 24px; font: 16px/1.5 system-ui, sans-serif; color: var(--tinta); background: #fff; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.ayuda { color: var(--suave); margin: 0 0 18px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input { font: inherit; padding: 8px 10px; border: 1px solid var(--linea); border-radius: 6px; width: 12em; }
  table { border-collapse: collapse; margin-top: 18px; min-width: 320px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--linea); }
  td.cifra { text-align: right; font-variant-numeric: tabular-nums; }
  .barra { height: 10px; border-radius: 5px; background: var(--acento); }
</style>
</head>
<body>
<h1>Calculadora 50/30/20</h1>
<p class="ayuda">Escribe tus ingresos netos del mes y mira cómo se reparten.</p>
<label for="ingresos">Ingresos netos (€)</label>
<input id="ingresos" type="number" min="0" step="10" value="1800">
<table aria-live="polite">
  <thead><tr><th>Para qué</th><th>%</th><th>Euros</th><th></th></tr></thead>
  <tbody id="reparto"></tbody>
</table>
<script>
  const partes = [['Necesidades', 50], ['Deseos', 30], ['Ahorro', 20]];
  const euros = n => n.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
  function pintar() {
    const total = Number(document.getElementById('ingresos').value) || 0;
    document.getElementById('reparto').innerHTML = partes.map(([que, pc]) =>
      `<tr><td>${que}</td><td class="cifra">${pc} %</td><td class="cifra" data-parte="${que}">${euros(total * pc / 100)}</td><td><div class="barra" style="width:${pc * 2}px"></div></td></tr>`).join('');
  }
  document.getElementById('ingresos').addEventListener('input', pintar);
  pintar();
</script>
</body>
</html>
