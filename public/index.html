<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno</title>
<link rel="stylesheet" href="/assets/katex/dist/katex.min.css">
<link rel="stylesheet" href="/assets/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="/public/estilo.css">
</head>
<body>
<a class="saltar" href="#nota">Saltar al contenido</a>
<div id="app">
  <aside id="lateral" aria-label="Cuaderno">
    <header class="marca"><span class="logo" aria-hidden="true">▣</span><span id="nombre-curso">Cuaderno</span></header>
    <label class="oculto" for="buscador">Buscar nota o texto</label>
    <input id="buscador" type="search" placeholder="Buscar nota o texto…  (Ctrl K)" autocomplete="off">
    <nav class="paginas" aria-label="Páginas">
      <a id="link-inicio" href="#/" data-pagina="inicio">🏠 Inicio</a>
      <a href="#/tareas" data-pagina="tareas">☑ Tareas <span class="contador" id="n-tareas"></span></a>
      <a href="#/comentarios" data-pagina="comentarios">💬 Comentarios <span class="contador" id="n-comentarios"></span></a>
    </nav>
    <nav id="arbol" aria-label="Notas"></nav>
    <footer class="pie-lateral">
      <button type="button" id="btn-terminal" title="Abrir la terminal (Ctrl `)">⌨ Terminal</button>
      <button type="button" id="btn-profesor" title="Abre al profesor en la terminal" hidden>🎓 Profesor</button>
    </footer>
  </aside>
  <main id="centro">
    <div id="miga" aria-label="Ruta de la nota"></div>
    <article id="nota" tabindex="-1"></article>
    <section id="panel" hidden></section>
  </main>
  <section id="terminal-panel" aria-label="Terminal" hidden>
    <div class="terminal-barra"><span id="terminal-titulo">Terminal</span><button type="button" id="btn-cerrar-terminal" aria-label="Cerrar la terminal">✕</button></div>
    <div id="terminal"></div>
  </section>
</div>
<div id="editor" role="dialog" aria-modal="true" aria-labelledby="editor-titulo" hidden>
  <div class="editor-caja">
    <header><span id="editor-titulo">Editar bloque</span><span class="editor-lineas" id="editor-lineas"></span></header>
    <label class="oculto" for="editor-texto">Texto en Markdown</label>
    <textarea id="editor-texto" spellcheck="false"></textarea>
    <footer><span class="pista">Ctrl Enter guarda · Esc cancela</span><button type="button" id="editor-cancelar" class="secundario">Cancelar</button><button type="button" id="editor-guardar">Guardar</button></footer>
  </div>
</div>
<script src="/assets/katex/dist/katex.min.js"></script>
<script src="/assets/@xterm/xterm/lib/xterm.js"></script>
<script src="/assets/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="/public/app.js"></script>
</body>
</html>
