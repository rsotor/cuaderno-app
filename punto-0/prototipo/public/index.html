<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno</title>
<link rel="stylesheet" href="/assets/katex/dist/katex.min.css">
<link rel="stylesheet" href="/assets/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="/public/estilo.css">
</head>
<body>
<div id="app">
  <aside id="lateral">
    <header class="marca"><span class="logo">▣</span><span id="nombre-curso">Cuaderno</span></header>
    <input id="buscador" type="search" placeholder="Buscar nota o texto…  (Ctrl K)" autocomplete="off">
    <nav class="paginas">
      <a href="#/n/inicio.md" data-pagina="inicio">🏠 Inicio</a>
      <a href="#/tareas" data-pagina="tareas">☑ Tareas <span class="contador" id="n-tareas"></span></a>
      <a href="#/comentarios" data-pagina="comentarios">💬 Comentarios <span class="contador" id="n-comentarios"></span></a>
    </nav>
    <div id="arbol"></div>
    <footer class="pie-lateral"><button id="btn-terminal" title="Ctrl `">⌨ Terminal</button><button id="btn-profesor" title="Abre al profesor en la terminal">🎓 Profesor</button></footer>
  </aside>
  <main id="centro">
    <div id="miga"></div>
    <article id="nota"></article>
    <section id="panel" hidden></section>
  </main>
  <section id="terminal-panel" hidden>
    <div class="terminal-barra"><span>Terminal · <code id="terminal-cwd"></code></span><button id="btn-cerrar-terminal">✕</button></div>
    <div id="terminal"></div>
  </section>
</div>
<div id="editor" hidden>
  <div class="editor-caja">
    <header><span id="editor-titulo">Editar bloque</span><span class="editor-lineas" id="editor-lineas"></span></header>
    <textarea id="editor-texto" spellcheck="false"></textarea>
    <footer><button id="editor-cancelar" class="secundario">Cancelar</button><button id="editor-guardar">Guardar</button></footer>
  </div>
</div>
<script src="/assets/katex/dist/katex.min.js"></script>

<script src="/assets/@xterm/xterm/lib/xterm.js"></script>
<script src="/assets/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="/public/app.js"></script>
</body>
</html>
