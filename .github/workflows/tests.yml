# Tests del repo en GitHub Actions.
#   push (solo main)    → Linux: npm test + recorridos de navegador. En una rama, la lanza su pull request (no dos veces el mismo commit).
#   pull_request        → Linux, macOS y Windows: lo mismo en los tres (el run de Windows compila node-pty con Node 24).
#   workflow_dispatch   → los tres sistemas, a mano, desde la pestaña Actions.
# Solo se lanza cuando cambia algo que afecta a los tests: código, pantalla, la app de escritorio (electron/ y su
# empaquetado), tests, dependencias o este fichero (el filtro `*.js` no cruza directorios: electron/** va aparte).
# Un commit que solo toca docs/, capturas o Markdown no gasta nada.
# El coste en repo privado: macOS cuenta ×10 y Windows ×2 contra la cuota; en repo público, cero.
name: Tests

on:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "public/**"
      - "electron/**"
      - "tests/**"
      - "pruebas/**"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.yml"
      - ".github/workflows/tests.yml"
      - ".github/workflows/empaquetar.yml"
  pull_request:
    paths:
      - "*.js"
      - "public/**"
      - "electron/**"
      - "tests/**"
      - "pruebas/**"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.yml"
      - ".github/workflows/tests.yml"
      - ".github/workflows/empaquetar.yml"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sistemas:
    # Decide en qué sistemas se corre según el disparador (ver cabecera).
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.elegir.outputs.lista }}
    steps:
      - id: elegir
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'lista=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'lista=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: sistemas
    name: ${{ matrix.sistema }}
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sistema: ${{ fromJSON(needs.sistemas.outputs.lista) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Dependencias (compila node-pty en cada sistema)
        run: npm ci

      - name: Tests de Node
        # Con el suelo de cobertura del código del servidor (85 % de líneas, ramas y funciones; Roberto, 2026-10-09).
        run: npm run test:cobertura

      - name: Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Recorridos de navegador
        # En Linux, además, la cobertura del código de la pantalla (informe, no suelo).
        env:
          CUADERNO_COBERTURA_PANTALLA: ${{ runner.os == 'Linux' && '.cobertura-pantalla' || '' }}
        run: npm run test:navegador

      - name: Cobertura de la pantalla (informe)
        if: runner.os == 'Linux'
        run: node pruebas/cobertura-pantalla.js .cobertura-pantalla
