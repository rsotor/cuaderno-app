# Tests del repo en GitHub Actions.
#   push (solo main)    → Linux: npm test + recorridos de navegador + recorridos de Electron (xvfb-run). En una rama, la
#                         lanza su pull request (no dos veces el mismo commit).
#   pull_request        → Linux y Windows (el run de Windows compila node-pty con Node 24); macOS solo si el PR lleva la
#                         etiqueta `macos`: añadirla lanza la CI y quitarla no hace nada. Otra etiqueta no relanza nada.
#                         Los recorridos de Electron, en Linux; en Mac y Windows solo a mano (coste: R5 del plan).
#   workflow_dispatch   → los tres sistemas, a mano, desde la pestaña Actions, con los recorridos de Electron en los tres.
# Por qué macOS no corre por defecto (Roberto, 2026-10-13): cuenta ×10 en la cuota del repo privado y duplica la prueba
# local, que ya se hace en su Mac real (`npm test` antes de subir). La etiqueta `macos` es para cambios propios del Mac
# (menús, empaquetado).
# Los recorridos de Electron (`tests/electron/`, Playwright `_electron`, experimental) van en un paso propio con su tiempo
# máximo: si fallan por su cuenta se pueden pasar a manual sin tocar el resto (R9). El binario de Electron (~100 MB) no lo
# baja `npm ci` (Electron 44 no tiene postinstall): lo baja `node node_modules/electron/install.js` en un paso explícito,
# con la caché de descargas de @electron/get guardada entre runs (actions/cache). Empaquetar (.dmg y .exe) es otro
# workflow, empaquetar.yml: a mano o con una etiqueta v*.
# Solo se lanza cuando cambia algo que afecta a los tests: código, pantalla, la app de escritorio (electron/ y su
# empaquetado), tests, dependencias o este fichero (el filtro `*.js` no cruza directorios: electron/** va aparte).
# Un commit que solo toca docs/, capturas o Markdown no gasta nada.
# `tests-ok` es el único check obligatorio de la regla de `main`: resume los jobs (`needs`) y falla si alguno acabó en
# failure o cancelled. «skipped» NO es fallo (macOS se salta a propósito sin la etiqueta); así, añadir o quitar un sistema
# de la matriz no obliga a tocar la regla. Un solo `if: always()` a secas saldría verde aunque todo fallase: por eso mira
# los resultados.
# El coste en repo privado: macOS cuenta ×10 y Windows ×2 contra la cuota; en repo público, cero.
name: Tests

on:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "public/**"
      - "electron/**"
      - "tests/**"
      - "pruebas/**"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.js"
      - ".github/workflows/tests.yml"
      - ".github/workflows/empaquetar.yml"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "*.js"
      - "public/**"
      - "electron/**"
      - "tests/**"
      - "pruebas/**"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.js"
      - ".github/workflows/tests.yml"
      - ".github/workflows/empaquetar.yml"
  workflow_dispatch:

concurrency:
  # Un `labeled` con otra etiqueta que `macos` va a un grupo aparte: sus jobs se saltan y no cancelan el run en curso.
  group: tests-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'macos' && 'otra' || 'ci' }}
  cancel-in-progress: true

jobs:
  sistemas:
    # Decide en qué sistemas se corre según el disparador (ver cabecera).
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'macos'
    outputs:
      lista: ${{ steps.elegir.outputs.lista }}
    steps:
      - id: elegir
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'lista=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ contains(github.event.pull_request.labels.*.name, 'macos') }}" = "false" ]; then
            echo 'lista=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'lista=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: sistemas
    name: ${{ matrix.sistema }}
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sistema: ${{ fromJSON(needs.sistemas.outputs.lista) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Dependencias (compila node-pty en cada sistema)
        run: npm ci

      - name: Tests de Node
        # Con el suelo de cobertura del código del servidor (85 % de líneas, ramas y funciones; Roberto, 2026-10-09).
        run: npm run test:cobertura

      - name: Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Recorridos de navegador
        # En Linux, además, la cobertura del código de la pantalla (informe, no suelo).
        env:
          CUADERNO_COBERTURA_PANTALLA: ${{ runner.os == 'Linux' && '.cobertura-pantalla' || '' }}
        run: npm run test:navegador

      - name: Cobertura de la pantalla (informe)
        if: runner.os == 'Linux'
        run: node pruebas/cobertura-pantalla.js .cobertura-pantalla

      # ── Recorridos de Electron ─────────────────────────────────────────────────────────────────────────────────────
      # En Linux siempre; en Mac y Windows solo a mano (workflow_dispatch): el run de Mac cuenta ×10 en repo privado y el
      # recorrido es el mismo código en los tres sistemas. La misma condición en los cuatro pasos.
      - name: Versión de Electron (para la clave de la caché)
        id: electron
        if: runner.os == 'Linux' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: echo "version=$(node -p "require('./node_modules/electron/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Caché del binario de Electron
        if: runner.os == 'Linux' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          # La caché de descargas de @electron/get, que es la misma para install.js y para electron-builder: cada sistema
          # usa la suya (el resto no existe en ese runner y actions/cache lo ignora). Un zip por versión y arquitectura.
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}

      - name: Binario de Electron
        # Con la caché presente no descarga nada: solo extrae el zip en node_modules/electron/dist (~2 s).
        if: runner.os == 'Linux' || github.event_name == 'workflow_dispatch'
        run: node node_modules/electron/install.js

      - name: Sandbox de Chromium en Linux
        # Ubuntu 24 restringe los espacios de nombres sin privilegios (AppArmor) y Chromium cae al ayudante SUID, que
        # aborta si no es de root con 4755 («The SUID sandbox helper binary was found, but is not configured
        # correctly»): los 15 recorridos fallaban al lanzar (primer run real, 2026-10-10; en el contenedor de desarrollo
        # se corría como root, con --no-sandbox). Se configura el ayudante en vez de quitar el sandbox: los recorridos
        # corren con el mismo sandbox que la app.
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Recorridos de Electron
        # Sin pantalla en Linux: xvfb-run. Los tests fijan TMPDIR corto, configuración y userData temporales.
        if: runner.os == 'Linux' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 10
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a npm run test:electron' || 'npm run test:electron' }}

  tests-ok:
    # Check resumen (ver cabecera): el único obligatorio en la regla de `main`.
    name: tests-ok
    if: always()
    needs: [sistemas, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Todos los jobs en verde (o saltados a propósito)
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Algún job de la CI falló o se canceló"
          exit 1
